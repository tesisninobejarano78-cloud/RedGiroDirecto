<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red observada del giro directo</title>
<!--
  Visor de la red observada del giro directo: la ADRES gira al prestador por cuenta de
  cada EPS (EPS → prestador). La flecha dice quién ordena y de quién es la UPC, no quién
  transfiere el dinero.
  Lo genera observada/construir-visor-observada.py a partir de esta plantilla: no
  editar el visor generado, editar la plantilla y volver a correr el script.
  Sin dependencias externas: funciona sin conexión.
-->
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --border: rgba(11, 11, 11, 0.10);
    --wash: rgba(11, 11, 11, 0.05);
    --control: #ffffff;
    --control-hover: #efeee9;
    --border-strong: rgba(11, 11, 11, 0.20);
    --seleccion: rgba(42, 120, 214, 0.12);
    --sombra: 0 1px 3px rgba(0, 0, 0, 0.06), 0 6px 20px rgba(0, 0, 0, 0.08);
    --recursos: #2a78d6;
    --informacion: #eb6834;
    --ambas: #1baf7a;
    --dep-repartida: #86b6ef;
    --dep-mayoritaria: #2a78d6;
    --dep-una: #104281;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #f0efec;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --border: rgba(255, 255, 255, 0.10);
      --wash: rgba(255, 255, 255, 0.06);
      --control: #262625;
      --control-hover: #31312f;
      --border-strong: rgba(255, 255, 255, 0.18);
      --seleccion: rgba(57, 135, 229, 0.24);
      --sombra: 0 1px 3px rgba(0, 0, 0, 0.35), 0 6px 20px rgba(0, 0, 0, 0.45);
      --recursos: #3987e5;
      --informacion: #d95926;
      --ambas: #199e70;
      --dep-repartida: #184f95;
      --dep-mayoritaria: #3987e5;
      --dep-una: #b7d3f6;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --border: rgba(255, 255, 255, 0.10);
    --wash: rgba(255, 255, 255, 0.06);
    --control: #262625;
    --control-hover: #31312f;
    --border-strong: rgba(255, 255, 255, 0.18);
    --seleccion: rgba(57, 135, 229, 0.24);
    --sombra: 0 1px 3px rgba(0, 0, 0, 0.35), 0 6px 20px rgba(0, 0, 0, 0.45);
    --recursos: #3987e5;
    --informacion: #d95926;
    --ambas: #199e70;
    --dep-repartida: #184f95;
    --dep-mayoritaria: #3987e5;
    --dep-una: #b7d3f6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--page);
    color: var(--ink);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #app {
    display: grid;
    grid-template-columns: 300px 1fr;
    grid-template-rows: auto 1fr;
    height: 100vh;
  }
  header {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 16px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .version { color: var(--ink-2); font-size: 12px; }
  header .acciones { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  button, select, input[type="search"], input[type="text"] {
    font: inherit;
    color: var(--ink);
    background-color: var(--control);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 5px 10px;
    min-height: 30px;
  }
  select { cursor: pointer; }
  /* Las opciones de una lista se dibujan aparte de la página: llevan fondo y color propios para leerse en los dos temas. */
  select option, select optgroup { background-color: var(--control); color: var(--ink); }
  button { cursor: pointer; transition: background-color 0.12s, border-color 0.12s, opacity 0.12s; }
  button:hover:not(:disabled), select:hover { background-color: var(--control-hover); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.4; cursor: default; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--recursos); outline-offset: 1px; }
  input[type="checkbox"], input[type="radio"] { accent-color: var(--recursos); margin: 0; width: 14px; height: 14px; flex: none; cursor: pointer; }
  input::placeholder { color: var(--muted); }
  header .grupo { display: flex; gap: 6px; align-items: center; }
  header .grupo + .grupo { padding-left: 8px; border-left: 1px solid var(--border); }
  #contrastes { max-width: 260px; }
  #filtros {
    overflow-y: auto;
    border-right: 1px solid var(--border);
    background: var(--surface);
    padding: 6px 16px 24px;
  }
  #filtros { scrollbar-width: thin; scrollbar-color: var(--grid) transparent; }
  #filtros details { border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  #filtros details:last-of-type { border-bottom: none; }
  #filtros summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-2);
    margin: 12px 0 6px;
    font-weight: 600;
    user-select: none;
  }
  #filtros summary::-webkit-details-marker { display: none; }
  #filtros summary::after {
    content: "";
    width: 6px;
    height: 6px;
    border-right: 1.5px solid var(--muted);
    border-bottom: 1.5px solid var(--muted);
    transform: rotate(45deg);
    margin: 0 4px 3px 0;
    transition: transform 0.15s;
  }
  #filtros details:not([open]) > summary::after { transform: rotate(-45deg); margin-bottom: 0; }
  #filtros summary:hover { color: var(--ink); }
  #filtros label { display: flex; align-items: center; gap: 7px; padding: 3px 5px; margin: 0 -5px; border-radius: 5px; cursor: pointer; }
  #filtros label:hover { background: var(--wash); }
  #filtros label .cuenta { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  #filtros label .nota { color: var(--muted); font-size: 11px; }
  #filtros select, #filtros input[type="search"] { width: 100%; }
  .enlaces { display: flex; gap: 6px; margin: 0 0 6px; }
  .enlaces[hidden] { display: none; }
  .enlaces button { min-height: 0; padding: 1px 10px; font-size: 11.5px; border-radius: 999px; color: var(--ink-2); }
  .pista { color: var(--muted); font-size: 11.5px; margin-top: 3px; }
  .subtitulo { font-size: 12px; color: var(--ink-2); margin: 8px 0 2px; }
  .ayuda { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
  .clave-linea { width: 26px; height: 10px; flex: none; }
  main { position: relative; overflow: hidden; background: var(--surface); }
  #lienzo { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #lienzo.arrastrando { cursor: grabbing; }
  .flotante {
    position: absolute;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: var(--sombra);
  }
  #resumen { left: 12px; top: 12px; padding: 6px 10px; max-width: min(620px, calc(100% - 380px)); font-size: 12px; color: var(--ink-2); }
  #resumen strong { color: var(--ink); }
  #leyenda { left: 12px; bottom: 12px; padding: 8px 12px; font-size: 12px; max-width: calc(100% - 80px); }
  #leyenda .fila { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin: 2px 0; }
  #leyenda .item { display: inline-flex; align-items: center; gap: 6px; }
  #leyenda .titulo { color: var(--ink-2); min-width: 64px; }
  #zoom { right: 12px; bottom: 12px; display: flex; flex-direction: column; overflow: hidden; }
  #zoom button { border: none; border-radius: 0; width: 34px; height: 32px; min-height: 0; padding: 0; font-size: 17px; display: flex; align-items: center; justify-content: center; background-color: var(--surface); }
  #zoom button + button { border-top: 1px solid var(--border); }
  #detalle { right: 12px; top: 12px; width: 350px; max-height: calc(100% - 70px); overflow-y: auto; padding: 12px 14px; display: none; }
  #detalle h3 { margin: 0 26px 2px 0; font-size: 14px; }
  #detalle .sub { color: var(--ink-2); font-size: 12px; margin-bottom: 8px; }
  #detalle dl { display: grid; grid-template-columns: 150px 1fr; gap: 3px 10px; margin: 0 0 8px; font-size: 12px; }
  #detalle dt { color: var(--ink-2); }
  #detalle dd { margin: 0; font-variant-numeric: tabular-nums; }
  #detalle h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-2); margin: 12px 0 4px; }
  #detalle ul { list-style: none; padding: 0; margin: 0; }
  #detalle li { padding: 4px 0; border-top: 1px solid var(--border); font-size: 12px; display: flex; gap: 8px; }
  #detalle li .nombre { flex: 1; }
  #detalle li .valor { color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  #detalle li button { border: none; background: none; padding: 0; min-height: 0; text-align: left; color: var(--ink); text-decoration: underline; text-decoration-color: var(--muted); }
  #detalle .cerrar { position: absolute; right: 8px; top: 8px; border: none; font-size: 16px; padding: 2px 8px; }
  #detalle p { font-size: 12px; color: var(--ink-2); margin: 6px 0; }
  #tooltip { pointer-events: none; padding: 6px 9px; font-size: 12px; display: none; max-width: 320px; z-index: 5; }
  #tooltip strong { display: block; color: var(--ink); }
  #tooltip span { color: var(--ink-2); display: block; }
  #tabla { position: absolute; inset: 0; overflow: auto; background: var(--surface); padding: 14px 18px 40px; display: none; }
  #tabla h2 { font-size: 13px; margin: 8px 0; }
  #tabla p { color: var(--ink-2); margin: 0 0 8px; font-size: 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; margin-bottom: 18px; }
  tbody tr:hover td { background: var(--wash); }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  th { color: var(--ink-2); font-weight: 600; position: sticky; top: -14px; background: var(--surface); }
  td.num, th.num { font-variant-numeric: tabular-nums; text-align: right; }
  #aviso { left: 50%; bottom: 18px; transform: translateX(-50%); padding: 8px 14px; font-size: 12.5px; display: none; z-index: 10; background: var(--ink); color: var(--page); border-color: transparent; white-space: nowrap; }
  #campo-enlace { width: 100%; margin-top: 6px; font: inherit; font-size: 11px; display: none; }
  @media (max-width: 860px) {
    #app { grid-template-columns: 1fr; grid-template-rows: auto auto 75vh; height: auto; }
    #filtros { border-right: none; border-bottom: 1px solid var(--border); max-height: none; }
    #detalle { width: calc(100% - 24px); }
    #resumen { max-width: calc(100% - 24px); }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1 id="titulo"></h1>
      <div class="version" id="version"></div>
    </div>
    <div class="acciones">
      <div class="grupo">
        <select id="contrastes" aria-label="Vistas sugeridas" title="Vistas preparadas para comparar"></select>
      </div>
      <div class="grupo">
        <button id="btn-ajustar" type="button" title="Encuadrar toda la red">Ajustar vista</button>
        <button id="btn-vista" type="button" title="Ver lo resaltado como tabla">Tabla</button>
      </div>
      <div class="grupo">
        <button id="btn-png" type="button" title="Descargar la vista actual como imagen">Exportar PNG</button>
        <button id="btn-enlace" type="button" title="Copiar un enlace que reproduce esta vista">Copiar enlace</button>
      </div>
      <div class="grupo">
        <button id="btn-restablecer" type="button" title="Quitar los filtros y volver al encuadre inicial">Restablecer</button>
        <button id="btn-tema" type="button" title="Cambiar de tema">Tema</button>
      </div>
    </div>
  </header>

  <aside id="filtros" aria-label="Filtros">
    <details open><summary>Mes</summary>
    <div id="meses"></div>

    </details>
    <details open><summary>Capas</summary>
    <label><input type="checkbox" id="capa-recursos" checked>
      <svg class="clave-linea" viewBox="0 0 26 10" aria-hidden="true"><line x1="1" y1="5" x2="25" y2="5" stroke="var(--recursos)" stroke-width="2"/></svg>
      Recursos: giro de la ADRES por cuenta de la EPS</label>
    <label><input type="checkbox" id="capa-informacion" checked>
      <svg class="clave-linea" viewBox="0 0 26 10" aria-hidden="true"><line x1="1" y1="5" x2="25" y2="5" stroke="var(--informacion)" stroke-width="2" stroke-dasharray="6 4"/></svg>
      Información: hacia la ADRES</label>

    </details>
    <details open><summary>Color de los prestadores</summary>
    <select id="color" aria-label="Color de los prestadores">
      <option value="capas">Capa en que participan</option>
      <option value="dependencia">Dependencia de su EPS principal</option>
    </select>

    </details>
    <details open><summary>Tipo de prestador</summary>
    <div class="enlaces">
      <button type="button" id="tipos-todos">Todos</button><button type="button" id="tipos-ninguno">Ninguno</button>
    </div>
    <div id="tipos"></div>

    </details>
    <details open><summary>Dependencia de su EPS principal</summary>
    <div id="dependencia"></div>
    <p class="ayuda">Sobre lo que el prestador recibe por giro directo en el mes.</p>

    </details>
    <details open><summary>Departamento del prestador</summary>
    <select id="depto" aria-label="Departamento del prestador"></select>

    </details>
    <details open><summary>Buscar</summary>
    <input type="search" id="buscar" list="lista-nombres" placeholder="EPS, prestador o NIT" aria-label="Buscar EPS o prestador">
    <datalist id="lista-nombres"></datalist>
    <p class="ayuda">Enter selecciona la primera coincidencia y muestra sus vínculos.</p>

    </details>
    <details open><summary>Presentación</summary>
    <label><input type="checkbox" id="ocultar"> Ocultar en vez de atenuar</label>
    <div class="subtitulo">Aristas de recursos</div>
    <select id="aristas" aria-label="Aristas de recursos">
      <option value="todas">Las de lo resaltado, más el resto tenue</option>
      <option value="resaltadas">Solo las de lo resaltado</option>
    </select>
    <div class="subtitulo">Etiquetas</div>
    <select id="etiquetas" aria-label="Etiquetas">
      <option value="eps">EPS, ADRES y Supersalud</option>
      <option value="todas">También prestadores al acercar</option>
      <option value="ninguna">Ninguna</option>
    </select>
    <input type="text" id="campo-enlace" readonly aria-label="Enlace de la vista">
    </details>
  </aside>

  <main id="principal">
    <canvas id="lienzo" role="img" aria-label="Red del giro directo: EPS en un anillo, sus prestadores alrededor y la ADRES en el centro. La vista de tabla contiene la misma información."></canvas>
    <div id="resumen" class="flotante"></div>
    <div id="leyenda" class="flotante" aria-label="Leyenda"></div>
    <div id="zoom" class="flotante">
      <button type="button" id="zoom-mas" aria-label="Acercar" title="Acercar (tecla +)">+</button>
      <button type="button" id="zoom-menos" aria-label="Alejar" title="Alejar (tecla −)">&minus;</button>
      <button type="button" id="zoom-ajustar" aria-label="Ajustar vista" title="Ajustar vista (tecla 0)"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
    </div>
    <div id="detalle" class="flotante" aria-live="polite"></div>
    <div id="tooltip" class="flotante" role="tooltip"></div>
    <div id="aviso" class="flotante" role="status"></div>
    <div id="tabla"></div>
  </main>
</div>

<script>window.DATOS = /*__DATOS__*/null;</script>
<script>
(function () {
  "use strict";
  const D = window.DATOS;
  if (!D) { document.body.textContent = "El visor no tiene datos: genérelo con observada/construir-visor-observada.py."; return; }

  // ------------------------------------------------------------ formato
  const $ = id => document.getElementById(id);
  const normalizar = t => (t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const f0 = new Intl.NumberFormat("es-CO", { maximumFractionDigits: 0 });
  const f1 = new Intl.NumberFormat("es-CO", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const f2 = new Intl.NumberFormat("es-CO", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const f3 = new Intl.NumberFormat("es-CO", { minimumFractionDigits: 3, maximumFractionDigits: 3 });
  function pesos(v) {
    if (v == null) return "—";
    if (Math.abs(v) >= 1e12) return "$" + f2.format(v / 1e12) + " billones";
    if (Math.abs(v) >= 1e6) return "$" + f0.format(Math.round(v / 1e6)) + " millones";
    return "$" + f0.format(Math.round(v));
  }
  const pct = v => v == null ? "—" : f1.format(v) + " %";
  const el = (etiqueta, props, hijos) => {
    const n = document.createElement(etiqueta);
    if (props) Object.keys(props).forEach(k => {
      if (k === "texto") n.textContent = props[k];
      else if (k === "clase") n.className = props[k];
      else n.setAttribute(k, props[k]);
    });
    (hijos || []).forEach(h => n.appendChild(typeof h === "string" ? document.createTextNode(h) : h));
    return n;
  };

  // ------------------------------------------------------------ catálogos
  const EPS = D.eps;
  const PRE = D.prestadores.map(p => ({ nit: p[0], nombre: p[1], tipo: p[2], forma: p[3], depto: p[4], municipio: p[5] }));
  const TIPOS = D.tipos;
  const DEPTOS = D.departamentos;
  const CORTES = D.meta.cortes;
  const ADRES = { x: 0, y: -20 }, SNS = { x: 0, y: 36 };
  const DEP = {
    todas: "Todos",
    una: "Reciben de una sola EPS",
    mayoritaria: "Su EPS principal da la mitad o más",
    repartida: "Ninguna EPS da la mitad"
  };
  const nivelDep = p => p.eps === 1 ? "una" : (p.parte >= 50 ? "mayoritaria" : "repartida");
  const FORMAS = {
    circulo: "Prestador público",
    cuadrado: "Prestador privado o mixto",
    triangulo: "Receptor sin inscripción en el REPS"
  };
  const idxEps = nombre => EPS.findIndex(e => normalizar(e.nombre) === normalizar(nombre));

  const CACHE = {};
  function datosCorte(c) {
    if (CACHE[c]) return CACHE[c];
    const d = D.cortes[c];
    const pres = d.prestadores.map(r => ({ i: r[0], x: r[1], y: r[2], girado: r[3], eps: r[4], parte: r[5], inter: r[6], s: PRE[r[0]] }));
    const porPre = new Map(pres.map(p => [p.i, p]));
    const aristas = d.aristas.map(r => ({ e: r[0], p: r[1], w: r[2] }));
    const porEps = new Map(), dePre = new Map();
    aristas.forEach(a => {
      if (!porEps.has(a.e)) porEps.set(a.e, []);
      porEps.get(a.e).push(a);
      if (!dePre.has(a.p)) dePre.set(a.p, []);
      dePre.get(a.p).push(a);
    });
    const eps = new Map(d.eps.map(o => [o.i, o]));
    let gmaxP = 1, wmax = 1, gmaxE = 1, progMax = 1;
    pres.forEach(p => { if (p.girado > gmaxP) gmaxP = p.girado; });
    aristas.forEach(a => { if (a.w > wmax) wmax = a.w; });
    d.eps.forEach(o => { gmaxE = Math.max(gmaxE, o.girado); progMax = Math.max(progMax, o.programado, o.sns_girado); });
    CACHE[c] = { d, pres, porPre, aristas, porEps, dePre, eps, gmaxP, wmax, gmaxE, progMax };
    return CACHE[c];
  }

  // --------------------------------------------------------------- estado
  function estadoInicial() {
    return {
      corte: D.meta.principal,
      capas: { recursos: true, informacion: true },
      color: "capas",
      tipos: new Set(TIPOS.map((_, i) => i)),
      dep: "todas",
      depto: "",
      buscar: "",
      sel: null,
      ocultar: false,
      aristas: "todas",
      etiquetas: "eps",
      vista: "grafo"
    };
  }
  let E = estadoInicial();

  const CONTRASTES = [
    { id: "", etiqueta: "Vistas sugeridas…" },
    { id: "una", etiqueta: "Prestadores que reciben de una sola EPS", aplicar: e => { e.dep = "una"; e.color = "dependencia"; } },
    { id: "mayoritaria", etiqueta: "Prestadores donde una EPS da la mitad o más", aplicar: e => { e.dep = "mayoritaria"; e.color = "dependencia"; } },
    { id: "repartida", etiqueta: "Prestadores repartidos entre varias EPS", aplicar: e => { e.dep = "repartida"; e.color = "dependencia"; } },
    { id: "ese", etiqueta: "Hospitales públicos (ESE)", aplicar: e => { e.tipos = new Set([0]); e.color = "dependencia"; } },
    { id: "privadas", etiqueta: "IPS privadas", aplicar: e => { e.tipos = new Set([2]); e.color = "dependencia"; } },
    { id: "sinreps", etiqueta: "Receptores sin inscripción en el REPS", aplicar: e => { e.tipos = new Set([5, 6]); e.color = "dependencia"; } },

  // ------------------------------------------------------- datos derivados

  // ----------------------------------------------------------------- enlace
  function aEnlace() {
    const q = new URLSearchParams();
    if (E.corte !== D.meta.principal) q.set("c", E.corte);
    if (!E.capas.recursos || !E.capas.informacion) q.set("cap", (E.capas.recursos ? "r" : "") + (E.capas.informacion ? "i" : ""));
    if (E.color !== "capas") q.set("col", E.color);
    if (E.tipos.size < TIPOS.length) q.set("t", [...E.tipos].sort().join("."));
    if (E.dep !== "todas") q.set("dep", E.dep);
    if (E.depto !== "") q.set("d", E.depto);
    if (E.buscar.trim()) q.set("q", E.buscar.trim());
    if (E.sel) q.set("s", E.sel.t === "e" ? "e" + E.sel.i : E.sel.t === "p" ? "p" + PRE[E.sel.i].nit : E.sel.t);
    if (E.ocultar) q.set("o", "1");
    if (E.aristas !== "todas") q.set("a", E.aristas);
    if (E.etiquetas !== "eps") q.set("et", E.etiquetas);
    if (E.vista !== "grafo") q.set("v", E.vista);
    const h = q.toString();
    ultimoEnlace = h;
    try { history.replaceState(null, "", h ? "#" + h : location.pathname + location.search); } catch (err) { /* sin historial disponible */ }
  }
  function deEnlace() {
    const q = new URLSearchParams(location.hash.slice(1));
    if (q.has("c") && D.cortes[q.get("c")]) E.corte = q.get("c");
    if (q.has("cap")) { const c = q.get("cap"); E.capas = { recursos: c.includes("r"), informacion: c.includes("i") }; }
    if (q.get("col") === "dependencia") E.color = "dependencia";
    if (q.has("t")) E.tipos = new Set(q.get("t").split(".").filter(x => x !== "").map(Number).filter(i => i >= 0 && i < TIPOS.length));
    if (DEP[q.get("dep")]) E.dep = q.get("dep");
    if (q.has("d") && DEPTOS[+q.get("d")]) E.depto = q.get("d");
    if (q.has("q")) E.buscar = q.get("q");
    const s = q.get("s");
    if (s === "adres" || s === "sns") E.sel = { t: s };
    else if (s && s[0] === "e" && EPS[+s.slice(1)]) E.sel = { t: "e", i: +s.slice(1) };
    else if (s && s[0] === "p") { const i = PRE.findIndex(p => p.nit === s.slice(1)); if (i >= 0) E.sel = { t: "p", i }; }
    E.ocultar = q.get("o") === "1";
    if (q.get("a") === "resaltadas") E.aristas = "resaltadas";
    if (["todas", "ninguna"].includes(q.get("et"))) E.etiquetas = q.get("et");
    if (q.get("v") === "tabla") E.vista = "tabla";
  }

  }
  function teclas(e, quitarSeleccion, factor) {
    if (e.key === "Escape") { quitarSeleccion(); return; }
    const t = e.target;
    if (e.ctrlKey || e.metaKey || e.altKey || (t && /^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName))) return;
    if (e.key === "+" || e.key === "=") zoom(factor, ancho / 2, alto / 2);
    else if (e.key === "-" || e.key === "_") zoom(1 / factor, ancho / 2, alto / 2);
    else if (e.key === "0") cambio({ reencuadrar: true });
  }

  // ------------------------------------------------------------ eventos
  function nodoEn(px, py) {
    if (!C) return null;
    const K = C.K;
    let mejor = null, d0 = Infinity;
    const probar = (sel, x, y, r) => {
      const d = Math.hypot(px - x, py - y);
      if (d < Math.max(7, r + 4) && d < d0) { d0 = d; mejor = sel; }
    };
    [[{ t: "adres" }, ADRES], [{ t: "sns" }, SNS]].forEach(([s, n]) => { if (s.t === "adres" || E.capas.informacion) { const [x, y] = P(n); probar(s, x, y, 9); } });
    EPS.forEach((e, i) => {
      if (!K.eps.has(i) || (E.ocultar && !C.epsRes.has(i))) return;
      const [x, y] = P(e); probar({ t: "e", i }, x, y, radioE(i));
    });
    if (mejor) return mejor;
    K.pres.forEach(p => {
      if (E.ocultar && !C.coincide.has(p.i)) return;
      const [x, y] = P(p); probar({ t: "p", i: p.i }, x, y, radioP(p));
    });
    return mejor;
  }

      t.appendChild(el("span", { texto: f0.format(o.exclusivos) + " reciben solo de ella" }));
    } else if (s.t === "p") {
      const p = K.porPre.get(s.i);
      t.appendChild(el("strong", { texto: p.s.nombre }));
      t.appendChild(el("span", { texto: TIPOS[p.s.tipo] + " · " + DEPTOS[p.s.depto] }));
      t.appendChild(el("span", { texto: pesos(p.girado) + " de " + f0.format(p.eps) + " EPS · la principal da el " + pct(p.parte) }));
    } else {

      t.appendChild(el("span", { texto: s.t === "adres" ? "Ejecuta el pago por cuenta de las EPS" : "Comunica giros y retenciones a la ADRES" }));

  }
  function ocultarTooltip() { $("tooltip").style.display = "none"; lienzo.style.cursor = ""; }
  function zoom(f, px, py) {
    const k = Math.max(0.2, Math.min(12, T.k * f));
    const g = k / T.k;
    T.x = px - (px - T.x) * g;
    T.y = py - (py - T.y) * g;
    T.k = k;
    redibujar();
    estadoBotones();
  }
  const mismo = (a, b) => a && b && a.t === b.t && a.i === b.i;
  function enlazarEventos() {
    $("capa-recursos").addEventListener("change", e => { E.capas.recursos = e.target.checked; cambio(); });
    $("capa-informacion").addEventListener("change", e => { E.capas.informacion = e.target.checked; cambio(); });
    $("color").addEventListener("change", e => { E.color = e.target.value; cambio(); });
    $("tipos-todos").addEventListener("click", () => { E.tipos = new Set(TIPOS.map((_, i) => i)); cambio(); });
    $("tipos-ninguno").addEventListener("click", () => { E.tipos = new Set(); cambio(); });
    $("depto").addEventListener("change", e => { E.depto = e.target.value; cambio(); });
    $("buscar").addEventListener("input", e => { E.buscar = e.target.value; cambio(); });
    $("buscar").addEventListener("keydown", e => {
      if (e.key !== "Enter") return;
      const q = normalizar(E.buscar.trim());
      if (!q) return;
      const ie = EPS.findIndex(x => normalizar(x.nombre).includes(q));
      if (ie >= 0 && C.K.eps.has(ie)) { E.sel = { t: "e", i: ie }; E.buscar = ""; cambio(); return; }
      const p = C.K.pres.filter(x => normalizar(x.s.nombre + " " + x.s.nit).includes(q)).sort((a, b) => b.girado - a.girado)[0];
      if (p) { E.sel = { t: "p", i: p.i }; E.buscar = ""; cambio(); }
    });
    $("ocultar").addEventListener("change", e => { E.ocultar = e.target.checked; cambio(); });
    $("aristas").addEventListener("change", e => { E.aristas = e.target.value; cambio(); });
    $("etiquetas").addEventListener("change", e => { E.etiquetas = e.target.value; cambio(); });
    $("contrastes").addEventListener("change", e => {
      const c = CONTRASTES.find(x => x.id === e.target.value);
      if (c && c.aplicar) {
        const corte = E.corte; E = estadoInicial(); E.corte = corte; c.aplicar(E); contraste = null;
        cambio({ reencuadrar: true });
        contraste = { id: c.id, enlace: ultimoEnlace };
        estadoBotones();
        aviso("Vista: " + c.etiqueta);
      } else e.target.value = "";
    });
    $("btn-ajustar").addEventListener("click", () => cambio({ reencuadrar: true }));
    $("btn-vista").addEventListener("click", () => { E.vista = E.vista === "grafo" ? "tabla" : "grafo"; cambio(); });
    $("btn-restablecer").addEventListener("click", () => { E = estadoInicial(); cambio({ reencuadrar: true }); aviso("Vista inicial restablecida"); });
    $("zoom-ajustar").addEventListener("click", () => cambio({ reencuadrar: true }));
    $("btn-png").addEventListener("click", exportarPNG);
    $("btn-enlace").addEventListener("click", copiarEnlace);
    $("btn-tema").addEventListener("click", cambiarTema);
    $("zoom-mas").addEventListener("click", () => zoom(1.3, ancho / 2, alto / 2));
    $("zoom-menos").addEventListener("click", () => zoom(1 / 1.3, ancho / 2, alto / 2));
    document.addEventListener("keydown", e => teclas(e, () => { if (E.sel) { E.sel = null; cambio(); } }, 1.3));

    let arrastre = null;
    lienzo.addEventListener("pointerdown", e => {
      arrastre = { x: e.clientX, y: e.clientY, tx: T.x, ty: T.y, movio: false };
      lienzo.setPointerCapture(e.pointerId);
    });
    lienzo.addEventListener("pointermove", e => {
      if (arrastre) {
        const dx = e.clientX - arrastre.x, dy = e.clientY - arrastre.y;
        if (Math.abs(dx) + Math.abs(dy) > 3) { arrastre.movio = true; lienzo.classList.add("arrastrando"); }
        if (arrastre.movio) { T.x = arrastre.tx + dx; T.y = arrastre.ty + dy; ocultarTooltip(); redibujar(); estadoBotones(); }
        return;
      }
      mostrarTooltip(nodoEn(e.offsetX, e.offsetY), e.offsetX, e.offsetY);
    });
    lienzo.addEventListener("pointerup", e => {
      if (arrastre && !arrastre.movio) {
        const s = nodoEn(e.offsetX, e.offsetY);
        E.sel = s ? (mismo(s, E.sel) ? null : s) : null;
        cambio();
      }
      arrastre = null;
      lienzo.classList.remove("arrastrando");
    });
    lienzo.addEventListener("pointerleave", ocultarTooltip);
    lienzo.addEventListener("wheel", e => {
      e.preventDefault();
      zoom(Math.exp(-e.deltaY * 0.0015), e.offsetX, e.offsetY);
    }, { passive: false });
    new ResizeObserver(() => { medir(); ajustar(); dibujar(); estadoBotones(); }).observe(lienzo.parentElement);
    if (oscuroDelSistema.addEventListener) oscuroDelSistema.addEventListener("change", () => { rotularTema(); leerColores(); cambio(); });
  }

  // ------------------------------------------------------- exportar y tema
  function exportarPNG() {
    const escala = 2, pie = 112;
    const c2 = document.createElement("canvas");
    c2.width = Math.round(ancho * escala);
    c2.height = Math.round((alto + pie) * escala);
    const g = c2.getContext("2d");
    g.scale(escala, escala);
    pintarEscena(g, ancho, alto + pie);
    const y0 = alto + 8;
    g.save();
    g.fillStyle = colores["--ink"];
    g.font = "600 13px system-ui, -apple-system, 'Segoe UI', sans-serif";
    g.textBaseline = "top";
    g.textAlign = "left";
    g.fillText(D.meta.titulo + " — " + nombreCorte(E.corte), 14, y0);
    g.font = "12px system-ui, -apple-system, 'Segoe UI', sans-serif";
    g.fillStyle = colores["--ink-2"];
    g.fillText(descripcionVista(), 14, y0 + 20);
    g.fillText(D.meta.version, 14, y0 + 38);
    let x = 14;
    const y = y0 + 64;
    ["recursos", "informacion"].filter(c => E.capas[c]).forEach(capa => {
      g.strokeStyle = colores["--" + capa]; g.lineWidth = 2; g.setLineDash(capa === "informacion" ? [6, 4] : []);
      g.beginPath(); g.moveTo(x, y + 7); g.lineTo(x + 26, y + 7); g.stroke(); g.setLineDash([]);
      const t = capa === "recursos" ? "Recursos" : "Información";
      g.fillStyle = colores["--ink-2"]; g.fillText(t, x + 32, y);
      x += 32 + g.measureText(t).width + 18;
    });
    const { colorItems, formas } = itemsLeyenda();
    colorItems.concat(formas).forEach(([c, f, t]) => {
      if (x + 30 + g.measureText(t).width > ancho - 10) { x = 14; }
      trazarForma(g, f, x + 6, (x === 14 ? y + 22 : y) + 7, 5); g.fillStyle = c; g.fill();
      g.fillStyle = colores["--ink-2"]; g.fillText(t, x + 16, x === 14 ? y + 22 : y);
      x += 16 + g.measureText(t).width + 16;
    });
    g.restore();
    c2.toBlob(blob => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "red-observada-" + E.corte + ".png";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      aviso("Imagen descargada: " + a.download);
    });
  }
  async function copiarEnlace() {
    aEnlace();
    try {
      await navigator.clipboard.writeText(location.href);
      aviso("Enlace de la vista copiado");
    } catch (err) {
      const campo = $("campo-enlace");
      campo.style.display = "block";
      campo.value = location.href;
      campo.focus();
      campo.select();
      aviso("Copie el enlace del campo seleccionado, al final de los filtros");
    }
  }
  const oscuroDelSistema = window.matchMedia("(prefers-color-scheme: dark)");
  function temaActual() { return document.documentElement.dataset.theme || (oscuroDelSistema.matches ? "dark" : "light"); }
  function rotularTema() {
    const oscuro = temaActual() === "dark";
    $("btn-tema").textContent = oscuro ? "Tema claro" : "Tema oscuro";
    $("btn-tema").title = oscuro ? "Pasar al tema claro" : "Pasar al tema oscuro";
  }
  function cambiarTema() {
    document.documentElement.dataset.theme = temaActual() === "dark" ? "light" : "dark";
    rotularTema();
    leerColores();
    cambio();
  }


  // --------------------------------------------------------------- inicio
  leerColores();
  rotularTema();
  construirControles();
  deEnlace();
  enlazarEventos();
  medir();
  cambio({ reencuadrar: true });
})();
</script>
</body>
